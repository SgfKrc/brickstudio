plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brickstudio.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.brickstudio.app'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '0.9'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名,打出的 release 包可直接安装(仅供个人使用,不可上架)
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
